name: Post altcoin long/short table

# Triggered from outside, not by GitHub's own scheduler.
#
# The `schedule:` trigger was removed deliberately. GitHub puts scheduled runs
# on a low-priority queue - on a new repository that meant zero runs in half an
# hour - while workflow_dispatch runs start within seconds. An external cron
# service calls the dispatch API every 10 minutes instead. Re-adding `schedule:`
# would post duplicates whenever a throttled run eventually fired.
on:
  workflow_dispatch:

# If a run is somehow still going when the next fires, skip rather than stack up.
concurrency:
  group: post-table
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Keeps the coin list between runs so CoinGecko is hit once a day rather
      # than 144 times - their free tier rate-limits cloud IPs aggressively.
      - uses: actions/cache@v4
        with:
          path: cache
          key: universe-${{ github.run_id }}
          restore-keys: universe-

      - name: Install dependencies
        run: pip install --quiet -r requirements-webhook.txt

      - name: Post the table
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          COINALYZE_API_KEY: ${{ secrets.COINALYZE_API_KEY }}
          LAYOUT: mobile
          TOP_N: "20"
          POST_INTERVAL_MINUTES: "10"
        run: python post_once.py
